name: daily-sketchman

# 3 long + 3 short per week. Runner days are UTC; 04:30 UTC = 10:00 IST.
# Mon/Wed/Fri -> long (16:9). Tue/Thu/Sat -> short (9:16). Sun -> rest.
on:
  schedule:
    - cron: "30 4 * * 1,3,5"   # long
    - cron: "30 4 * * 2,4,6"   # short
  workflow_dispatch:
    inputs:
      format:
        description: "long or short"
        required: true
        default: "short"
      force:
        description: "ignore the 1-upload-per-day guard"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json back after each run

# Only one pipeline run at a time; a pending scheduled run waits rather than
# racing into a second YouTube upload.
concurrency:
  group: sketchman-upload
  cancel-in-progress: false

jobs:
  render-upload:
    runs-on: ubuntu-latest
    env:
      FORMAT: ""
      UPLOAD_SKIPPED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng

      - name: python deps
        run: pip install -r requirements.txt

      # Kokoro model (persisted between runs, ~200MB, downloaded once)
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1-${{ runner.os }}

      # Work dir also carries work/.state.cache.json (second state store; the
      # git-committed state.json is the first). Restore best-effort with a
      # fallback key so a cache miss never fails the job.
      - uses: actions/cache@v4
        with:
          path: work
          key: sketchman-work-${{ github.run_id }}
          restore-keys: |
            sketchman-work-

      - name: pick format
        id: fmt
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            F="${{ inputs.format }}"
          else
            DOW=$(date -u +%u)
            if [ "$DOW" = 1 ] || [ "$DOW" = 3 ] || [ "$DOW" = 5 ]; then F=long; else F=short; fi
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "FORMAT=$F" >> "$GITHUB_ENV"

      # Quota guard: never more than one upload per format per calendar day.
      # --force input bypasses it for intentional re-uploads.
      - name: quota guard (max 1 upload/day)
        run: |
          F=${{ steps.fmt.outputs.format }}
          SKIP=0
          if [ "${{ inputs.force }}" != "true" ] && python3 - "$F" <<'PY'
          import sys, state
          print("already uploaded a " + sys.argv[1] + " today; skipping (1/day guard)")
          sys.exit(0 if state.already_uploaded(sys.argv[1]) else 1)
          PY
          then
            SKIP=1
          fi
          echo "SKIP=$SKIP" >> "$GITHUB_ENV"
          echo "guard: format=$F skip=$SKIP"

      # Credential check FIRST (1 quota unit): fail fast + alert before any
      # render work if the refresh token is dead.
      - name: verify credentials
        if: ${{ env.SKIP != '1' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python upload.py --verify 2>&1 | tee /tmp/verify.log

      - name: render
        if: ${{ env.SKIP != '1' }}
        run: |
          set -o pipefail
          python generate.py --format ${{ steps.fmt.outputs.format }} 2>&1 | tee /tmp/render.log

      - name: upload
        if: ${{ env.SKIP != '1' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
          ALERT_SMTP_TO: ${{ secrets.ALERT_SMTP_TO }}
        run: |
          set -o pipefail
          F=${{ steps.fmt.outputs.format }}
          VID=$(ls -t $F-*.mp4 | head -1)
          META=${VID%.mp4}.json
          [ "$F" = short ] && FLAG=--short || FLAG=""
          python upload.py "$VID" "$META" $FLAG 2>&1 | tee /tmp/upload.log

      # Persist state.json back to the repo (git store) + cache store, so the
      # 1/day guard and rotation survive between ephemeral runners.
      - name: commit state
        if: always() && env.SKIP != '1'
        run: |
          set -eu
          git config user.name "sketchman-bot"
          git config user.email "actions@github.com"
          if git status --porcelain -- state.json | grep -q .; then
            git add state.json
            git commit -m "ci: record state $(date -u +%Y-%m-%d)" || true
            git push origin HEAD
          else
            echo "state.json unchanged"
          fi

      - name: notify on failure
        if: failure()
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
          ALERT_SMTP_TO: ${{ secrets.ALERT_SMTP_TO }}
        run: |
          set +e
          REASON="see the run log"
          if grep -q invalid_grant /tmp/verify.log /tmp/upload.log 2>/dev/null; then
            REASON="dead YouTube refresh token (invalid_grant) — run python reauth.py and gh secret set YOUTUBE_REFRESH_TOKEN"
          elif grep -q "\[fail\]" /tmp/*.log 2>/dev/null; then
            REASON="pipeline error — grep '[fail]' in step logs"
          fi
          python alerts.py \
            "Sketchman FAILED: $REASON" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

Reason: $REASON

State: $(python state.py summary 2>/dev/null || echo 'unavailable')"