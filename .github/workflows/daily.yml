name: daily-sketchman

# 2 long + 2 short per week. Runner days are UTC; 04:30 UTC = 10:00 IST.
# Mon/Thu -> long (16:9). Tue/Fri -> short (9:16), each the day after its long.
# Sat/Sun -> rest.
on:
  schedule:
    - cron: "30 4 * * 1,4"   # long
    - cron: "30 4 * * 2,5"   # short
  workflow_dispatch:
    inputs:
      format:
        description: "long or short"
        required: true
        default: "short"
      force:
        description: "ignore the 1-upload-per-day guard"
        type: boolean
        default: false
      verify_only:
        description: "run quota + credential checks only (no render/upload)"
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit state.json back after each run

# Only one pipeline run at a time; a pending scheduled run waits rather than
# racing into a second YouTube upload.
concurrency:
  group: sketchman-upload
  cancel-in-progress: false

env:
  LOG_LEVEL: info
  PYTHONUNBUFFERED: 1
  # Use lightweight Kokoro TTS on CI (local, ~200MB cached). OpenVoice (~3.6GB)
  # exceeds GitHub Actions runner disk space. Override locally for higher quality.
  TTS_ENGINE: ""           # set to "edge" to force Edge TTS
  VOICE_ENGINE: kokoro     # kokoro | edge | openvoice (local only)

jobs:
  render-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORMAT: ""
      UPLOAD_SKIPPED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      # Aggressive disk cleanup BEFORE any heavy installs/caches.
      # GitHub-hosted runners have ~14GB free; OpenVoice cache was ~3.6GB.
      - name: free disk space
        run: |
          set -euo pipefail
          echo "=== Disk before cleanup ==="
          df -h /
          # Remove unnecessary tool caches
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* 2>/dev/null || true
          # Clean pip cache (we'll rebuild what we need)
          rm -rf ~/.cache/pip 2>/dev/null || true
          # Clean npm cache if present
          rm -rf ~/.npm 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu espeak-ng libsndfile1

      - name: python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Kokoro model (persisted between runs, ~200MB, downloaded once)
      - uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1-${{ runner.os }}

      # Work dir carries work/.state.cache.json (second state store; the
      # git-committed state.json is the first). Restore best-effort with a
      # fallback key so a cache miss never fails the job.
      - uses: actions/cache@v4
        with:
          path: work
          key: sketchman-work-${{ runner.os }}-${{ hashFiles('state.py') }}
          restore-keys: |
            sketchman-work-${{ runner.os }}-

      # Voice setup (OpenVoice) - OPTIONAL on CI, continue-on-error.
      # Heavy (~3.6GB with wheels+checkpoints). Only runs if VOICE_ENGINE=openvoice.
      # On CI we use Kokoro (lightweight). OpenVoice is for local high-quality runs.
      - name: voice setup (OpenVoice - optional, CI skips unless forced)
        if: env.VOICE_ENGINE == 'openvoice'
        continue-on-error: true
        run: |
          echo "VOICE_ENGINE=openvoice requested — attempting OpenVoice setup..."
          chmod +x ci/setup-voice.sh
          ./ci/setup-voice.sh
          echo "openvoice_ready=true" >> "$GITHUB_ENV"

      - name: verify TTS engine availability
        run: |
          python3 - <<'PY'
          import os, voice
          engine = os.getenv("VOICE_ENGINE", "kokoro")
          print(f"Configured VOICE_ENGINE: {engine}")
          if engine == "openvoice":
              ready = voice._openvoice_ready()
              print(f"OpenVoice ready: {ready}")
              if not ready:
                  print("OpenVoice not ready; will fall back to Kokoro/Edge")
          elif engine == "kokoro":
              ok = voice._kokoro_probe()
              print(f"Kokoro probe: {ok}")
          elif engine == "edge":
              print("Edge TTS selected (no local models needed)")

      - name: pick format
        id: fmt
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            F="${{ inputs.format }}"
          else
            DOW=$(date -u +%u)
            if [ "$DOW" = 1 ] || [ "$DOW" = 4 ]; then F=long; else F=short; fi
          fi
          echo "format=$F" >> "$GITHUB_OUTPUT"
          echo "FORMAT=$F" >> "$GITHUB_ENV"

      # Quota guard: never more than one upload per format per calendar day.
      # --force input bypasses it for intentional re-uploads.
      - name: quota guard (max 1 upload/day per format)
        run: |
          F=${{ steps.fmt.outputs.format }}
          SKIP=0
          if [ "${{ inputs.force }}" != "true" ] && python3 - "$F" <<'PY'
          import sys, state
          print("already uploaded a " + sys.argv[1] + " today; skipping (1/day guard)")
          sys.exit(0 if state.already_uploaded(sys.argv[1]) else 1)
          PY
          then
            SKIP=1
          fi
          echo "SKIP=$SKIP" >> "$GITHUB_ENV"
          echo "guard: format=$F skip=$SKIP"

      # Quota check: fail fast if we'd exceed daily quota (10000 units default)
      - name: quota check
        if: ${{ env.SKIP != '1' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/quota.log
          import state
          if not state.can_upload():
              remaining = state.quota_remaining()
              print(f'[warn] Insufficient quota: {remaining} units remaining, need ~1600')
              exit(1)
          print(f'[ok] Quota check passed: {state.quota_remaining()} units remaining')
          PY

      # Credential check FIRST (1 quota unit): fail fast + alert before any
      # render work if the refresh token is dead.
      - name: verify credentials
        if: ${{ env.SKIP != '1' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python upload.py --verify 2>&1 | tee /tmp/verify.log

      - name: render
        if: ${{ env.SKIP != '1' && inputs.verify_only != true }}
        run: |
          set -o pipefail
          python generate.py --format ${{ steps.fmt.outputs.format }} 2>&1 | tee /tmp/render.log

      - name: upload
        if: ${{ env.SKIP != '1' && inputs.verify_only != true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
          ALERT_SMTP_TO: ${{ secrets.ALERT_SMTP_TO }}
          ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
        run: |
          set -o pipefail
          F=${{ steps.fmt.outputs.format }}
          [ "$F" = short ] && FLAG=--short || FLAG=""
          # upload.py has its own 1/day guard, so the dispatch `force` input has
          # to reach it or a forced run renders and then skips the upload.
          if [ "${{ inputs.force }}" = "true" ]; then FLAG="$FLAG --force"; fi
          python upload.py $FLAG 2>&1 | tee /tmp/upload.log

      - name: commit state
        if: always() && env.SKIP != '1'
        continue-on-error: true
        run: |
          set -eu
          git config user.name "sketchman-bot"
          git config user.email "actions@github.com"
          CHANGED=0
          for f in state.json latest.json; do
            if [ -f "$f" ] && git status --porcelain -- "$f" | grep -q .; then
              git add "$f"
              CHANGED=1
            fi
          done
          if [ "$CHANGED" = "1" ]; then
            git commit -m "ci: record state $(date -u +%Y-%m-%d)" || true
            git push origin HEAD --force-with-lease || echo "Push failed, state saved in cache"
          else
            echo "state.json and latest.json unchanged"
          fi

      # Upload logs as artifacts for debugging
      - name: upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_number }}
          path: /tmp/*.log
          retention-days: 7

      - name: notify on failure
        if: failure()
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
          ALERT_SMTP_TO: ${{ secrets.ALERT_SMTP_TO }}
          ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
        run: |
          set +e
          REASON="see the run log"
          if grep -q invalid_grant /tmp/verify.log /tmp/upload.log 2>/dev/null; then
            REASON="dead YouTube refresh token (invalid_grant) — run python reauth.py and gh secret set YOUTUBE_REFRESH_TOKEN"
          elif grep -q "\[fail\]" /tmp/*.log 2>/dev/null; then
            REASON="pipeline error — grep '[fail]' in step logs"
          elif grep -q "quotaExceeded\|dailyLimitExceeded" /tmp/*.log 2>/dev/null; then
            REASON="YouTube API quota exceeded — wait for daily reset or request quota increase"
          elif grep -q "No space left on device" /tmp/*.log 2>/dev/null; then
            REASON="GitHub Actions runner out of disk space — check cache sizes"
          fi
          python alerts.py \
            "Sketchman FAILED: $REASON" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Reason: $REASON

          State: $(python state.py summary 2>/dev/null || echo 'unavailable')"

      # Success notification (optional, can be enabled by setting NOTIFY_ON_SUCCESS=true)
      - name: notify on success
        if: success() && env.NOTIFY_ON_SUCCESS == 'true'
        env:
          ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
          ALERT_SMTP_APP_PASSWORD: ${{ secrets.ALERT_SMTP_APP_PASSWORD }}
          ALERT_SMTP_TO: ${{ secrets.ALERT_SMTP_TO }}
          ALERT_DISCORD_WEBHOOK: ${{ secrets.ALERT_DISCORD_WEBHOOK }}
          ALERT_SLACK_WEBHOOK: ${{ secrets.ALERT_SLACK_WEBHOOK }}
        run: |
          python alerts.py \
            "Sketchman SUCCESS" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Format: ${{ steps.fmt.outputs.format }}
          Video: $(python -c "import json,os; m=json.load(open('latest.json')) if os.path.exists('latest.json') else {}; print(m.get('video','unknown'))" 2>/dev/null || echo 'unknown')
          URL: $(python -c "import state; print(state.load().get('links', {}).get('$(date -u +%Y-%m-%d)', {}).get('${{ steps.fmt.outputs.format }}', 'unknown'))" 2>/dev/null || echo 'unknown')

          State: $(python state.py summary 2>/dev/null || echo 'unavailable')"