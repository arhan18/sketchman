<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
/*__BASECSS__*/

:root {
  --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, "DejaVu Serif", serif;
  --font-body: "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
  --caption-size: 30px;
}

body { background: var(--background); color: var(--ink); }
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 40%, rgba(0, 0, 0, .55) 100%);
}

.slug {
  position: absolute; top: 42px; left: 56px; z-index: 5;
  display: flex; align-items: center; gap: 12px;
  font: 700 12px/1 var(--font-body); letter-spacing: .28em; text-transform: uppercase;
  color: rgba(242, 237, 228, .5);
  animation: fade 1s ease-out both;
}
.slug b { color: var(--accent); font-weight: 700; }
.slug i { display: block; width: 44px; height: 1px; background: rgba(242, 237, 228, .25); }

.caption { bottom: 52px; }
.caption-line {
  color: #fff; background: rgba(8, 14, 20, .72);
  border-left: 3px solid var(--accent);
  padding: 13px 24px; border-radius: 2px; max-width: 78%;
  backdrop-filter: blur(3px);
  animation: capIn .45s ease-out both;
}
body.vertical .caption { bottom: 96px; }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes capIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes push { from { transform: scale(1.05); } to { transform: scale(1.13); } }
@keyframes panL { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes glowIn { from { opacity: 0; } to { opacity: .5; } }

/* ---------- cel-shaded cartoon hero (reference style) ---------- */
.cartwrap { position: absolute; inset: 0; }
.cartwrap .cartoon { position: absolute; inset: 0; width: 100%; height: 100%;
  animation: cartPush 18s ease-out both; }
@keyframes cartPush { from { transform: scale(1.02) translateY(6px); } to { transform: scale(1.1) translateY(-6px); } }

/* ---------- establish: depth, light, a lone figure ---------- */
.scene3d { position: absolute; inset: 0; overflow: hidden; }
.scene3d .cam { position: absolute; inset: 0; animation: push 11s ease-out both; }
.scene3d .sky {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, #05090e 0%, #0c141d 46%, #16222f 78%, #1d2b39 100%);
}
.scene3d .beam {
  position: absolute; top: -12%; left: 30%; width: 420px; height: 130%;
  background: linear-gradient(to bottom, rgba(229, 178, 74, .18), transparent 72%);
  transform: rotate(9deg); filter: blur(22px);
  animation: glowIn 2.4s ease-out both;
}
.scene3d .floor {
  position: absolute; left: -6%; right: -6%; bottom: 0; height: 34%;
  background: linear-gradient(to bottom, #0a1119, #060a0f);
  border-top: 1px solid rgba(229, 178, 74, .18);
}
.scene3d .window {
  position: absolute; right: 12%; top: 20%; width: 150px; height: 210px;
  border: 2px solid rgba(242, 237, 228, .16);
  background: linear-gradient(to bottom, rgba(229, 178, 74, .10), transparent);
  animation: fade 2s ease-out .3s both;
}
.scene3d .who { position: absolute; left: 26%; bottom: 33%; animation: panL 1.4s ease-out both;
  filter: drop-shadow(0 0 22px rgba(229, 178, 74, .28)); }
.scene3d .who.back { filter: blur(2.5px); opacity: .45; }
.scene3d .plate {
  position: absolute; right: 10%; bottom: 26%;
  border-left: 2px solid var(--accent); padding-left: 20px;
  animation: panL 1.2s ease-out .35s both;
}
.scene3d .plate .k { font: 700 11px/1 var(--font-body); letter-spacing: .26em;
  text-transform: uppercase; color: var(--accent); }
.scene3d .plate .p { margin: 12px 0 0; font: 400 34px/1.2 var(--font-display); color: #f2ede4; }
.scene3d .plate .t { margin: 8px 0 0; font: 400 16px/1.5 var(--font-body); color: rgba(242, 237, 228, .55); }

/* ---------- numbers: light on a dark stage ---------- */
.beat { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; }
.beat .ring {
  position: absolute; width: 460px; height: 460px; border-radius: 50%;
  border: 1px solid rgba(229, 178, 74, .22);
  animation: glowIn 2.6s ease-out both;
}
.beat .v {
  font: 400 clamp(140px, 19vw, 230px)/1 var(--font-display);
  color: var(--accent); letter-spacing: -.02em; text-shadow: 0 0 60px rgba(229, 178, 74, .35);
  animation: capIn .9s cubic-bezier(.2, .8, .2, 1) both;
}
.beat .l { font: 700 15px/1.4 var(--font-body); letter-spacing: .22em; text-transform: uppercase;
  color: rgba(242, 237, 228, .82); animation: fade .8s ease-out .35s both; }
.beat .s { font: 400 18px/1.55 var(--font-body); color: rgba(242, 237, 228, .5);
  max-width: 52%; text-align: center; animation: fade .8s ease-out .5s both; }

/* ---------- object: one lit object on a dark field ---------- */
.lit { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.lit .stage-light {
  position: absolute; left: 50%; top: -10%; width: 560px; height: 120%;
  margin-left: -280px; transform: rotate(6deg); filter: blur(26px);
  background: linear-gradient(to bottom, rgba(229, 178, 74, .2), transparent 68%);
  animation: glowIn 2.8s ease-out both;
}
.lit .thing { position: relative; width: 320px; height: 320px; animation: capIn 1s ease-out both; }
.lit .who-kabir { position: absolute; left: 7%; bottom: 11%; animation: panL 1.2s ease-out .2s both;
  filter: drop-shadow(0 0 34px rgba(229, 178, 74, .55)); }
.lit .side { position: absolute; right: 9%; bottom: 30%; max-width: 400px;
  text-align: right; animation: panR 1.1s ease-out .3s both; }
.lit .side .k { font: 700 11px/1 var(--font-body); letter-spacing: .26em;
  text-transform: uppercase; color: var(--accent); }
.lit .side .p { margin: 12px 0 0; font: 400 30px/1.2 var(--font-display); color: #f2ede4; }
.lit .side .s { margin: 10px 0 0; font: 400 17px/1.55 var(--font-body); color: rgba(242, 237, 228, .55); }
@keyframes panR { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- chart: light falling on a curve ---------- */
.rise { position: absolute; left: 10%; right: 10%; top: 22%; }
.rise .h { font: 400 34px/1.2 var(--font-display); color: #f2ede4; }
.rise .u { margin-top: 10px; font: 700 11px/1 var(--font-body); letter-spacing: .28em;
  text-transform: uppercase; color: rgba(242, 237, 228, .4); }
.rise svg { width: 100%; height: 280px; margin-top: 30px; overflow: visible; }
.rise .area { fill: url(#fade); }
.rise .line { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round;
  stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 2.8s ease-out .2s both; }
.rise .axis { stroke: rgba(242, 237, 228, .18); stroke-width: 1; }
.rise .tick { font: 400 15px/1 var(--font-body); fill: rgba(242, 237, 228, .45); }
@keyframes draw { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }
.rise .note { margin-top: 22px; font: 400 18px/1.55 var(--font-body); color: rgba(242, 237, 228, .6); max-width: 62%; }

/* ---------- split: two lives, one frame ---------- */
.twoframe { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; }
.twoframe .half { position: relative; padding: 16% 10%; display: flex; flex-direction: column; justify-content: center; }
.twoframe .half.left { background: linear-gradient(to bottom, #0a1118, #060b11); }
.twoframe .half.right { background: linear-gradient(to bottom, #14212e, #0b131c); }
.twoframe .half::after { content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(229, 178, 74, .3); }
.twoframe .half.left::after { right: 0; }
.twoframe .half.right::after { left: 0; }
.twoframe .k { font: 700 11px/1 var(--font-body); letter-spacing: .26em; text-transform: uppercase;
  color: rgba(242, 237, 228, .45); animation: fade .8s ease-out both; }
.twoframe .p { margin: 16px 0 12px; font: 400 36px/1.12 var(--font-display); color: #f2ede4;
  animation: panL 1s ease-out .15s both; }
.twoframe .right .p { color: var(--accent); animation-name: panR; }
@keyframes panR { from { transform: translateX(26px); opacity: 0; } to { transform: none; opacity: 1; } }
.twoframe ul { list-style: none; margin: 0; padding: 0; }
.twoframe li { font: 400 17px/1.7 var(--font-body); color: rgba(242, 237, 228, .58);
  border-top: 1px solid rgba(242, 237, 228, .1); animation: fade .8s ease-out both;
  animation-delay: calc(var(--i) * .12s + .3s); }

/* ---------- timeline: three beats in the dark ---------- */
.seq { position: absolute; left: 10%; right: 10%; top: 30%; }
.seq .line { height: 1px; background: rgba(242, 237, 228, .18); transform-origin: left;
  animation: drawx 1.6s ease-out both; }
@keyframes drawx { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.seq .row { display: flex; justify-content: space-between; margin-top: 40px; }
.seq .step { width: 27%; animation: capIn .9s ease-out both; animation-delay: calc(var(--i) * .25s); }
.seq .num { font: 700 11px/1 var(--font-body); letter-spacing: .24em; color: var(--accent); }
.seq .p { margin: 14px 0 8px; font: 400 26px/1.2 var(--font-display); color: #f2ede4; }
.seq .s { font: 400 16px/1.55 var(--font-body); color: rgba(242, 237, 228, .52); }

/* ---------- endcard ---------- */
.fadeout { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 18px; }
.fadeout .m { font: 400 56px/1.05 var(--font-display); color: #f2ede4; animation: capIn 1s ease-out both; }
.fadeout .m b { color: var(--accent); font-weight: 400; }
.fadeout .s { font: 400 19px/1.6 var(--font-body); color: rgba(242, 237, 228, .5);
  animation: fade 1s ease-out .4s both; }
.fadeout .k { margin-top: 22px; font: 700 11px/1 var(--font-body); letter-spacing: .3em;
  text-transform: uppercase; color: var(--accent); animation: fade 1s ease-out .6s both; }
</style>
</head>
<body>
<div id="stage"></div>
<script>window.PAYLOAD = /*__PAYLOAD__*/;</script>
<script>
window.SKETCHMAN_STYLE = (function () {
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function slug(series) {
    return '<div class="slug"><b>' + esc(series.host) + '</b><i></i>' + esc(series.show) + '</div>';
  }
  /* Cel-shaded character in a drawn environment, reference style: flat fills,
     bold outlines, one warm key light, a couple of shadow shapes. */
  function cartoonHero() {
    return '<svg class="cartoon" viewBox="0 0 1280 720" width="1280" height="720">'
      + '<rect width="1280" height="720" fill="#3d4756"/>'
      /* back wall + window with city */
      + '<rect x="0" y="0" width="1280" height="470" fill="#4a5566"/>'
      + '<rect x="820" y="90" width="360" height="300" rx="8" fill="#26303c" stroke="#1b232c" stroke-width="6"/>'
      + '<g fill="#f2c14e" opacity=".9">'
      + '<rect x="856" y="140" width="26" height="20"/><rect x="910" y="188" width="26" height="20"/>'
      + '<rect x="978" y="132" width="26" height="20"/><rect x="1046" y="212" width="26" height="20"/>'
      + '<rect x="1112" y="164" width="26" height="20"/></g>'
      + '<path d="M820 390 h360" stroke="#1b232c" stroke-width="6"/>'
      /* desk */
      + '<path d="M120 470 h1040 l-40 190 H160z" fill="#6b4f36" stroke="#241a12" stroke-width="6"/>'
      + '<path d="M120 470 h1040 l-8 38 H128z" fill="#87643f" opacity=".8"/>'
      /* laptop with glow */
      + '<path d="M470 470 l340 0 l-40 -170 H510z" fill="#2b3542" stroke="#151d25" stroke-width="6"/>'
      + '<path d="M492 452 l296 0 l-32 -136 H524z" fill="#5f7d94"/>'
      + '<ellipse cx="640" cy="470" rx="300" ry="60" fill="#9fc6d8" opacity=".18"/>'
      /* mug + papers */
      + '<path d="M330 400 v70 a26 26 0 0 0 52 0 v-70z" fill="#e0713f" stroke="#241a12" stroke-width="5"/>'
      + '<path d="M960 424 h150 v46 h-150z" fill="#efe7d8" stroke="#241a12" stroke-width="5"/>'
      /* Kabir at the desk, cel-shaded */
      + '<g transform="translate(180 250)">'
      + '<path d="M0 300 c0-96 44-150 104-150s104 54 104 150z" fill="#3f4a5c" stroke="#151d25" stroke-width="6"/>'
      + '<path d="M0 300 c0-96 44-150 104-150v150z" fill="#333d4c" opacity=".9"/>'
      + '<path d="M78 168 h52 l-6 44 h-40z" fill="#e0b48f" stroke="#151d25" stroke-width="5"/>'
      + '<circle cx="104" cy="104" r="56" fill="#eec39b" stroke="#151d25" stroke-width="6"/>'
      + '<path d="M50 96 q6 -62 56 -62 t54 60 q-24 -28 -58 -22 t-52 24z" fill="#2a2320"/>'
      + '<path d="M78 108 q12 -8 24 0" stroke="#151d25" stroke-width="5" fill="none" stroke-linecap="round"/>'
      + '<path d="M112 108 q12 -8 24 0" stroke="#151d25" stroke-width="5" fill="none" stroke-linecap="round"/>'
      + '<path d="M96 138 q16 8 30 -4" stroke="#151d25" stroke-width="5" fill="none" stroke-linecap="round"/>'
      + '<path d="M60 300 q44 -30 88 0 l-6 -44 q-38 -22 -76 0z" fill="#55627a" stroke="#151d25" stroke-width="5"/>'
      + '</g></svg>';
  }
  function person(h, w, tone, opts) {
    opts = opts || {};
    var rim = opts.rim
      ? '<path d="M10 168c0-50 18-98 40-98s40 48 40 98z" fill="none" stroke="#e5b24a" stroke-width="4" opacity=".95"/>'
      : '';
    var prop = opts.prop === 'case'
      ? '<rect x="98" y="120" width="30" height="44" rx="4" fill="none" stroke="#e5b24a" stroke-width="3"/>'
      : opts.prop === 'cup'
        ? '<path d="M108 132h22l-3 22h-16z" fill="none" stroke="#e5b24a" stroke-width="3"/>'
        : '';
    return '<svg viewBox="0 0 100 170" width="' + w + '" height="' + h + '">'
      + '<circle cx="50" cy="38" r="21" fill="' + tone + '"/>'
      + '<path d="M44 56h12v14H44z" fill="' + tone + '"/>'
      + '<path d="M10 168c0-50 18-98 40-98s40 48 40 98z" fill="' + tone + '"/>'
      + rim + prop
      + '</svg>';
  }
  function prop(kind) {
    var s = {
      jar: '<path d="M72 66h44v134a24 24 0 0 1-24 24H96a24 24 0 0 1-24-24z" fill="none" stroke="#e5b24a" stroke-width="3"/>'
           + '<rect x="66" y="42" width="56" height="24" rx="6" fill="#e5b24a" opacity=".85"/>'
           + '<path d="M78 156h32v30a10 10 0 0 1-10 10H88a10 10 0 0 1-10-10z" fill="#e5b24a" opacity=".35"/>',
      ledger: '<rect x="58" y="34" width="124" height="172" rx="6" fill="none" stroke="#e5b24a" stroke-width="3"/>'
             + '<path d="M78 76h84M78 108h84M78 140h56" stroke="#f2ede4" stroke-width="3" opacity=".35" stroke-linecap="round"/>'
             + '<circle cx="164" cy="186" r="9" fill="#e5b24a"/>',
      door: '<path d="M74 40h92v168H74z" fill="none" stroke="#e5b24a" stroke-width="3"/>'
            + '<path d="M74 208l92-168" stroke="#e5b24a" stroke-width="2" opacity=".35"/>'
            + '<circle cx="150" cy="128" r="6" fill="#e5b24a"/>',
      clock: '<circle cx="120" cy="120" r="80" fill="none" stroke="#e5b24a" stroke-width="3"/>'
            + '<path d="M120 120V72M120 120l32 20" stroke="#f2ede4" stroke-width="3" stroke-linecap="round" opacity=".7"/>',
      case: '<rect x="46" y="92" width="148" height="92" rx="8" fill="none" stroke="#e5b24a" stroke-width="3"/>'
            + '<path d="M104 92V72a16 16 0 0 1 16-16 16 16 0 0 1 16 16v20" fill="none" stroke="#e5b24a" stroke-width="3"/>'
            + '<path d="M46 132h148" stroke="#e5b24a" stroke-width="2" opacity=".5"/>'
    };
    return '<svg viewBox="0 0 240 240" width="100%" height="100%">'
      + (s[kind] || s.jar) + '</svg>';
  }

  var scenes = {
    hero: function (c) {
      return '<div class="cartwrap">' + cartoonHero() + '</div>';
    },
    establish: function (c) {
      var p = c.props || {}, s = window.PAYLOAD.series;
      return slug(s) + '<div class="scene3d"><div class="cam">'
        + '<div class="sky"></div><div class="beam"></div>'
        + '<div class="window"></div><div class="floor"></div>'
        + '<div class="who back" style="left:13%; bottom:35%;">' + person(110, 78, '#7e8b99') + '</div>'
        + '<div class="who">' + person(190, 132, '#0b1118') + '</div>'
        + '<div class="plate"><div class="k">' + esc(p.kicker || 'scene') + '</div>'
        + '<div class="p">' + esc(p.place) + '</div>'
        + '<div class="t">' + esc(p.time || '') + '</div></div>'
        + '</div></div>';
    },
    numbers: function (c) {
      var p = c.props || {}, s = window.PAYLOAD.series;
      return slug(s) + '<div class="beat"><div class="ring"></div>'
        + '<div class="v">' + esc(p.value) + '</div>'
        + '<div class="l">' + esc(p.label) + '</div>'
        + (p.sub ? '<div class="s">' + esc(p.sub) + '</div>' : '') + '</div>';
    },
    object: function (c) {
      var p = c.props || {}, s = window.PAYLOAD.series;
      return slug(s) + '<div class="lit"><div class="stage-light"></div>'
        + '<div class="thing">' + prop(p.shape) + '</div>'
        + '<div class="who-kabir">' + person(210, 146, '#2a4055',
            { rim: true, prop: p.prop || 'case' }) + '</div>'
        + '<div class="side"><div class="k">' + esc(p.kicker || 'the object') + '</div>'
        + '<div class="p">' + esc(p.label) + '</div>'
        + '<div class="s">' + esc(p.sub || '') + '</div></div></div>';
    },
    chart: function (c) {
      var p = c.props || {}, items = p.items || [], s = window.PAYLOAD.series;
      var values = items.map(function (i) { return Number(i.value); });
      var max = Math.max.apply(null, values) || 1;
      var min = Math.min.apply(null, values);
      var span = (max - min) || 1;
      var last = Math.max(items.length - 1, 1);
      var xAt = function (i) { return 46 + (i / last) * 908; };
      var pts = values.map(function (v, i) {
        return [xAt(i), 240 - ((v - min) / span) * 190];
      });
      var d = pts.map(function (pt, i) { return (i ? 'L' : 'M') + pt[0].toFixed(0) + ' ' + pt[1].toFixed(0); }).join(' ');
      var area = d + ' L' + xAt(items.length - 1).toFixed(0) + ' 240 L' + xAt(0).toFixed(0) + ' 240 Z';
      var ticks = items.map(function (it, i) {
        var anchor = i === 0 ? 'start' : (i === items.length - 1 ? 'end' : 'middle');
        return '<text class="tick" x="' + xAt(i).toFixed(0) + '" y="268" text-anchor="' + anchor + '">'
          + esc(it.label) + '</text>';
      }).join('');
      return slug(s) + '<div class="rise"><div class="h">' + esc(p.title) + '</div>'
        + '<div class="u">' + esc(p.unit || '') + '</div>'
        + '<svg viewBox="0 0 1000 280" preserveAspectRatio="none">'
        + '<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">'
        + '<stop offset="0%" stop-color="#e5b24a" stop-opacity=".26"/>'
        + '<stop offset="100%" stop-color="#e5b24a" stop-opacity="0"/></linearGradient></defs>'
        + '<path class="area" d="' + area + '"/><path class="line" d="' + d + '"/>'
        + '<line class="axis" x1="46" y1="240" x2="954" y2="240"/>' + ticks + '</svg>'
        + (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') + '</div>';
    },
    split: function (c) {
      var p = c.props || {}, l = p.left || {}, r = p.right || {}, s = window.PAYLOAD.series;
      function half(d, side) {
        var items = (d.lines || []).map(function (t, i) {
          return '<li style="--i:' + i + '">' + esc(t) + '</li>';
        }).join('');
        return '<div class="half ' + side + '"><div class="k">' + esc(d.who || '') + '</div>'
          + '<div class="p">' + esc(d.title) + '</div><ul>' + items + '</ul></div>';
      }
      return slug(s) + '<div class="twoframe">' + half(l, 'left') + half(r, 'right') + '</div>';
    },
    timeline: function (c) {
      var p = c.props || {}, steps = p.steps || [], s = window.PAYLOAD.series;
      var body = steps.map(function (st, i) {
        return '<div class="step" style="--i:' + i + '"><div class="num">0' + (i + 1) + '</div>'
          + '<div class="p">' + esc(st.label) + '</div>'
          + '<div class="s">' + esc(st.detail || '') + '</div></div>';
      }).join('');
      return slug(s) + '<div class="seq"><div class="line"></div><div class="row">' + body + '</div></div>';
    },
    endcard: function (c) {
      var p = c.props || {}, s = window.PAYLOAD.series;
      return '<div class="fadeout"><div class="m">' + esc(s.show) + '<b>.</b></div>'
        + '<div class="s">' + esc(p.line || 'New episodes twice a week.') + '</div>'
        + '<div class="k">' + esc(s.signoff) + '</div></div>';
    }
  };

  return {
    renderShot: function (clip) {
      return (scenes[clip.scene] || scenes.numbers)(clip);
    }
  };
})();
</script>
<script>/*__RUNTIME__*/</script>
</body>
</html>
