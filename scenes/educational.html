<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
/*__BASECSS__*/

:root {
  --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, "DejaVu Serif", serif;
  --font-body: "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
  --caption-size: 30px;
}

body { background: var(--background); }
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 180px rgba(42, 33, 24, .07);
}

.tag {
  position: absolute; top: 34px; left: 48px; z-index: 4;
  font: 700 13px/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase;
  color: #3f6ea8; animation: fadeIn .6s ease-out both;
}

.caption { bottom: 40px; }
.caption-line {
  background: rgba(253, 247, 234, .94);
  border: 3px solid #2a2118;
  border-radius: 10px; color: #2a2118;
  padding: 12px 24px; max-width: 78%;
  box-shadow: 0 10px 26px rgba(42, 33, 24, .18);
  animation: capIn .34s cubic-bezier(.2, .8, .2, 1) both;
}
body.vertical .caption { bottom: 92px; }
body.vertical .caption-line { max-width: 88%; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes capIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes panR { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes wobble {
  0%, 100% { transform: rotate(-1.4deg); }
  50% { transform: rotate(1.4deg); }
}
@keyframes drawLine { from { stroke-dashoffset: 1400; } to { stroke-dashoffset: 0; } }

.scene-note {
  position: absolute; z-index: 4;
  font: 400 30px/1.25 var(--font-display); color: #2a2118;
  background: rgba(253, 247, 234, .9); border: 3px solid #2a2118; border-radius: 12px;
  padding: 12px 22px; animation: popIn .5s cubic-bezier(.2, .9, .2, 1) both;
}
.scene-note.big { font-size: 92px; padding: 10px 28px; }
.scene-note .sm { display: block; font: 400 19px/1.4 var(--font-body); color: #5d5348; margin-top: 8px; }
.scene-note.top { left: 50%; top: 92px; transform: translateX(-50%); }
.scene-note.right { right: 8%; top: 44%; text-align: right; }
.scene-note.left { left: 7%; bottom: 26%; }
</style>
</head>
<body>
<div id="stage"></div>
<script>window.PAYLOAD = /*__PAYLOAD__*/;</script>
<script>/*__FLAT__*/</script>
<script>
window.SKETCHMAN_STYLE = (function () {
  var F = window.FLAT;
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function tag(s) {
    return '<div class="tag">' + esc(s.show) + '</div>';
  }
  function room(p) {
    return F.open(
      F.sky('#f7efdc', '#fbf6e8')
      + '<path d="M0 500 h1280" stroke="#2a2118" stroke-width="5" opacity=".25"/>'
      + '<path d="M0 560 h1280" stroke="#2a2118" stroke-width="5" opacity=".14"/>'
      + F.ground('#e9dcc0', 520)
      + F.grass(520));
  }
  function field(p) {
    return F.open(F.sky('#dceaf3', '#f6f1e2') + F.ground('#cfe0c4', 520) + F.grass(520));
  }
  function prop(kind) {
    var map = {
      jar: F.jar, phone: F.phone, calendar: F.calendar, mug: F.mug, ledger: F.ledger, door: F.door
    };
    return map[kind] || F.jar;
  }

  var scenes = {
    /* A drawn scene: the room, the character larger in frame, props in front. */
    establish: function (c) {
      var p = c.props || {};
      return tag(window.PAYLOAD.series) + F.open(
        F.roomDense()
        + F.laptop(760, 430, 0.95)
        + F.ledger(560, 520, 0.8, true)
        + F.mug(1080, 470, 0.9)
        + F.papers(300, 570, 0.85, -6)
        + F.phone(120, 300, 1.0)
        + F.kid(400, 230, 1.5, p.pose || "stand")
        + '<g><rect x="250" y="110" width="360" height="86" rx="14" fill="#fdf7ea" stroke="#2a2118" stroke-width="5"/>'
        + '<text x="430" y="166" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2a2118">'
        + esc(p.place || 'Payday') + '</text></g>');
    },

    /* A drawn object at scale, the character reacting, room behind. */
    object: function (c) {
      var p = c.props || {}, kind = p.shape || 'jar';
      var place = {
        jar: [600, 210, 1.35], phone: [560, 190, 1.2], calendar: [540, 300, 1.15],
        mug: [600, 250, 1.3], ledger: [430, 280, 1.15], door: [520, 170, 1.2]
      }[kind] || [600, 210, 1.35];
      return tag(window.PAYLOAD.series) + F.open(
        F.roomDense()
        + prop(kind)(place[0], place[1], place[2])
        + F.coinPile(920, 560, 1)
        + F.kid(190, 300, 1.25, p.pose || 'look')
        + (p.label ? '<g><rect x="760" y="150" width="430" height="130" rx="16" fill="#fdf7ea" stroke="#2a2118" stroke-width="5"/>'
            + '<text x="975" y="212" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2a2118">' + esc(p.label) + '</text>'
            + (p.sub ? '<text x="975" y="256" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="21" fill="#5d5348">' + esc(p.sub) + '</text>' : '')
            + '</g>' : ''));
    },

    /* Hand-drawn bars with value labels, character pointing at the tall one. */
    chart: function (c) {
      var p = c.props || {}, items = p.items || [];
      var max = Math.max.apply(null, items.map(function (i) { return Number(i.value); })) || 1;
      var bars = items.map(function (it, i) {
        var h = Math.max(40, (Number(it.value) / max) * 340);
        var x = 250 + i * 230;
        return '<rect x="' + x + '" y="' + (520 - h) + '" width="150" height="' + h + '" rx="12" fill="#3f6ea8" stroke="#2a2118" stroke-width="5"/>'
          + '<text x="' + (x + 75) + '" y="' + (500 - h) + '" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#2a2118">'
          + esc(it.display || it.value) + '</text>'
          + '<text x="' + (x + 75) + '" y="566" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="22" fill="#2a2118">'
          + esc(it.label) + '</text>';
      }).join('');
      return tag(window.PAYLOAD.series) + F.open(
        F.roomDense()
        + '<path d="M200 520 h1000" stroke="#2a2118" stroke-width="6" stroke-linecap="round"/>'
        + bars
        + F.coinPile(1080, 620, 1.1)
        + F.kid(60, 300, 1.2, 'point')
        + (p.title ? '<text x="200" y="150" font-family="Georgia, serif" font-size="44" fill="#2a2118">' + esc(p.title) + '</text>' : '')
        + (p.unit ? '<text x="200" y="196" font-family="Helvetica, sans-serif" font-size="21" letter-spacing="3" fill="#5d5348">' + esc(p.unit.toUpperCase()) + '</text>' : ''));
    },

    /* Two drawn moments side by side, each with the character and props. */
    split: function (c) {
      var p = c.props || {}, l = p.left || {}, r = p.right || {};
      function panel(d, side) {
        var kidX = side === 'left' ? 120 : 700;
        return '<g>' + F.ground(side === 'left' ? '#e5d8ba' : '#d8e6c8', 520)
          + F.rug(side === 'left' ? 330 : 940, 620, 250)
          + F.kid(kidX, 250, 1.35, side === 'left' ? (d.tone === 'up' ? 'point' : 'hold') : 'hold')
          + F.books(side === 'left' ? 470 : 1020, 540, 0.9)
          + F.coinPile(side === 'left' ? 520 : 1090, 600, 0.9)
          + '<text x="' + (side === 'left' ? 300 : 980) + '" y="180" text-anchor="middle" font-family="Georgia, serif" font-size="40" fill="#2a2118">'
          + esc(d.title || '') + '</text>'
          + (d.sub ? '<text x="' + (side === 'left' ? 300 : 980) + '" y="224" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="22" fill="#5d5348">' + esc(d.sub) + '</text>' : '')
          + '</g>';
      }
      return tag(window.PAYLOAD.series) + F.open(
        F.sky('#f8f0dc', '#fbf6e8')
        + panel(l, 'left') + panel(r, 'right')
        + '<path d="M640 40 v660" stroke="#2a2118" stroke-width="4" stroke-dasharray="16 16" opacity=".35" fill="none"/>');
    },

    /* A drawn note with coins stacking up behind it. */
    numbers: function (c) {
      var p = c.props || {};
      return tag(window.PAYLOAD.series) + F.open(
        F.roomDense()
        + F.coinStack(6, 800)
        + F.coinPile(1000, 600, 1.2)
        + F.kid(180, 300, 1.3, 'look')
        + '<g><rect x="300" y="150" width="560" height="210" rx="20" fill="#fdf7ea" stroke="#2a2118" stroke-width="6"/>'
        + '<text x="580" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="112" fill="#3f6ea8">'
        + esc(p.value || '') + '</text>'
        + (p.label ? '<text x="580" y="338" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="25" fill="#2a2118">' + esc(p.label) + '</text>' : '')
        + '</g>');
    },

    /* Three drawn steps on a path, character walking it. */
    timeline: function (c) {
      var p = c.props || {}, steps = p.steps || [];
      var icons = [F.phone, F.calendar, F.jar];
      var body = steps.slice(0, 3).map(function (st, i) {
        var x = 110 + i * 420;
        return '<g>'
          + icons[i](x, 210, 0.85)
          + '<text x="' + (x + 76) + '" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#2a2118">'
          + esc(st.label) + '</text>'
          + '<text x="' + (x + 76) + '" y="512" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="20" fill="#5d5348">'
          + esc(st.detail || '') + '</text></g>';
      }).join('');
      return tag(window.PAYLOAD.series) + F.open(
        F.roomDense()
        + '<path d="M90 600 h1100" stroke="#2a2118" stroke-width="6" fill="none" stroke-dasharray="22 18" class="pathdraw"/>'
        + body
        + F.kid(1090, 330, 1.05, 'point'));
    },

    endcard: function (c) {
      var s = window.PAYLOAD.series;
      return F.open(
        F.roomDense()
        + F.coinPile(300, 600, 1.3)
        + F.kid(520, 210, 1.5, 'point')
        + '<text x="640" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#2a2118">'
        + esc(s.show) + '</text>'
        + '<text x="640" y="660" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#3f6ea8">'
        + esc(s.signoff) + '</text>');
    },

    hero: function (c) { return scenes.establish(c); }
  };

  return {
    renderShot: function (clip) {
      return (scenes[clip.scene] || scenes.establish)(clip);
    }
  };
})();
</script>
<script>/*__RUNTIME__*/</script>
</body>
</html>
