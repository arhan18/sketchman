<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scene</title>
<style>
/*__BASECSS__*/

:root {
  --font-display: "Iowan Old Style", "Palatino Linotype", Georgia, "DejaVu Serif", serif;
  --font-body: "Helvetica Neue", "DejaVu Sans", Arial, sans-serif;
  --caption-size: 30px;
}

body { background: var(--background); }

.tag {
  position: absolute; top: 34px; left: 48px; z-index: 4;
  font: 700 13px/1 var(--font-body); letter-spacing: .2em; text-transform: uppercase;
  color: #e4572e; animation: fadeIn .6s ease-out both;
}

.caption { bottom: 40px; }
.caption-line {
  background: rgba(253, 247, 234, .94);
  border: 3px solid #2a2118; border-radius: 10px; color: #2a2118;
  padding: 12px 24px; max-width: 76%;
  box-shadow: 0 10px 26px rgba(42, 33, 24, .18);
  animation: capIn .34s cubic-bezier(.2, .8, .2, 1) both;
}
body.vertical .caption { bottom: 92px; }
body.vertical .caption-line { max-width: 88%; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes capIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

/* Myth-busters terrain: one wide field, few objects, a lot of air. */
.studio { return null; }
</style>
</head>
<body>
<div id="stage"></div>
<script>window.PAYLOAD = /*__PAYLOAD__*/;</script>
<script>/*__FLAT__*/</script>
<script>
window.SKETCHMAN_STYLE = (function () {
  var F = window.FLAT;
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function tag(s) {
    return '<div class="tag">' + esc(s.host) + ' &middot; ' + esc(s.show) + '</div>';
  }
  /* Wide, quiet ground so the single object carries the frame. */
  function field(top, bottom, gnd) {
    return F.sky(top, bottom) + F.ground(gnd, 520) + F.grass(520);
  }
  /* A drawn hole: the metaphor Mira keeps returning to. */
  function hole(x, y, s) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">'
      + '<ellipse cx="0" cy="0" rx="70" ry="24" fill="#2a2118"/>'
      + '<path d="M-70 0 q-16 40 -6 74" fill="none" stroke="#e4572e" stroke-width="7" stroke-linecap="round"/>'
      + '<g fill="#f2c14e" stroke="#2a2118" stroke-width="3">'
      + '<ellipse cx="-4" cy="46" rx="13" ry="9"/><ellipse cx="10" cy="70" rx="12" ry="8"/>'
      + '<ellipse cx="2" cy="94" rx="11" ry="8"/></g></g>';
  }
  function bucket(x, y, s) {
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">'
      + '<path d="M-84 0 h168 l-22 150 a26 26 0 0 1 -26 24 h-72 a26 26 0 0 1 -26 -24z" fill="#e0713f" stroke="#2a2118" stroke-width="6"/>'
      + '<ellipse cx="0" cy="0" rx="84" ry="22" fill="#f0916a" stroke="#2a2118" stroke-width="6"/>'
      + '<g fill="#f2c14e" stroke="#2a2118" stroke-width="3">'
      + '<circle cx="-26" cy="-4" r="15"/><circle cx="16" cy="-8" r="17"/><circle cx="46" cy="-2" r="13"/></g>'
      + '<path d="M-84 -6 q-20 14 -14 30" fill="none" stroke="#2a2118" stroke-width="5"/></g>';
  }
  function prop(kind) {
    return { bucket: bucket, jar: F.jar, phone: F.phone, ledger: F.ledger,
             calendar: F.calendar, mug: F.mug, door: F.door }[kind] || bucket;
  }

  var scenes = {
    /* One object, Mira watching. The whole frame is about the metaphor. */
    object: function (c) {
      var p = c.props || {};
      return tag(window.PAYLOAD.series) + F.open(
        field('#f7f2ea', '#fbf7f1', '#e3dccd')
        + prop(p.shape || 'bucket')(640, 400, 1.15)
        + hole(430, 520, 1)
        + F.girl(880, 300, 1.15, p.pose || 'look')
        + F.tuft(180, 540)
        + (p.label ? '<g><rect x="120" y="150" width="360" height="112" rx="16" fill="#fdf7ea" stroke="#2a2118" stroke-width="5"/>'
            + '<text x="300" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#2a2118">' + esc(p.label) + '</text>'
            + (p.sub ? '<text x="300" y="246" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="20" fill="#5d5348">' + esc(p.sub) + '</text>' : '')
            + '</g>' : ''));
    },

    /* The myth, drawn: a big calm field with the character in the middle. */
    establish: function (c) {
      var p = c.props || {};
      return tag(window.PAYLOAD.series) + F.open(
        field('#f2ece2', '#faf6ef', '#ded6c6')
        + F.girl(540, 250, 1.4, p.pose || 'stand')
        + bucket(300, 430, 0.9)
        + hole(880, 500, 0.9)
        + F.tuft(1150, 540) + F.tuft(150, 560)
        + (p.place ? '<g><rect x="430" y="120" width="420" height="90" rx="16" fill="#fdf7ea" stroke="#2a2118" stroke-width="5"/>'
            + '<text x="640" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2a2118">'
            + esc(p.place) + '</text></g>' : ''));
    },

    /* Numbers, but drawn as an object instead of a title card. */
    numbers: function (c) {
      var p = c.props || {};
      return tag(window.PAYLOAD.series) + F.open(
        field('#f7f2ea', '#fbf7f1', '#e3dccd')
        + F.coinStack(7, 640)
        + F.girl(300, 320, 1.2, 'look')
        + hole(960, 540, 0.9)
        + '<g><rect x="800" y="180" width="380" height="150" rx="18" fill="#fdf7ea" stroke="#2a2118" stroke-width="6"/>'
        + '<text x="990" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="86" fill="#e4572e">'
        + esc(p.value || '') + '</text>'
        + (p.label ? '<text x="990" y="312" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="21" fill="#2a2118">' + esc(p.label) + '</text>' : '')
        + '</g>');
    },

    /* Two beliefs, two drawn vignettes. */
    split: function (c) {
      var p = c.props || {}, l = p.left || {}, r = p.right || {};
      function panel(d, side) {
        var kx = side === 'left' ? 210 : 800;
        return '<g>' + F.ground(side === 'left' ? '#e6ded0' : '#e9dfd0', 520)
          + F.rug(kx + 80, 620, 210)
          + F.girl(kx, 280, 1.2, side === 'left' ? 'shrug' : 'hold')
          + (side === 'left' ? bucket(kx + 220, 470, 0.7) : F.coinStack(4, kx + 220))
          + '<text x="' + (side === 'left' ? 320 : 960) + '" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="38" fill="#2a2118">'
          + esc(d.title || '') + '</text>'
          + (d.sub ? '<text x="' + (side === 'left' ? 320 : 960) + '" y="212" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="21" fill="#5d5348">' + esc(d.sub) + '</text>' : '')
          + '</g>';
      }
      return tag(window.PAYLOAD.series) + F.open(
        field('#f6f1e8', '#fbf8f2', '#e2dbcc')
        + panel(l, 'left') + panel(r, 'right')
        + '<path d="M640 40 v640" stroke="#2a2118" stroke-width="4" stroke-dasharray="16 16" opacity=".3" fill="none"/>');
    },

    /* The data, drawn as a plain growing row. */
    chart: function (c) {
      var p = c.props || {}, items = p.items || [];
      var max = Math.max.apply(null, items.map(function (i) { return Number(i.value); })) || 1;
      var bars = items.map(function (it, i) {
        var h = Math.max(36, (Number(it.value) / max) * 300);
        var x = 250 + i * 220;
        return '<rect x="' + x + '" y="' + (520 - h) + '" width="140" height="' + h + '" rx="10" fill="#e4572e" stroke="#2a2118" stroke-width="5"/>'
          + '<text x="' + (x + 70) + '" y="566" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="21" fill="#2a2118">' + esc(it.label) + '</text>';
      }).join('');
      return tag(window.PAYLOAD.series) + F.open(
        field('#f4efe6', '#fbf7f0', '#e0d8c8')
        + '<path d="M200 520 h920" stroke="#2a2118" stroke-width="6" stroke-linecap="round"/>'
        + bars
        + F.girl(60, 320, 1.05, 'point')
        + hole(1100, 560, 0.8)
        + (p.title ? '<text x="200" y="150" font-family="Georgia, serif" font-size="42" fill="#2a2118">' + esc(p.title) + '</text>' : ''));
    },

    /* Three drawn steps on a path. */
    timeline: function (c) {
      var p = c.props || {}, steps = p.steps || [];
      var icons = [F.phone, F.calendar, F.jar];
      var body = steps.slice(0, 3).map(function (st, i) {
        var x = 100 + i * 420;
        return '<g>' + icons[i](x, 220, 0.8)
          + '<text x="' + (x + 72) + '" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#2a2118">' + esc(st.label) + '</text>'
          + '<text x="' + (x + 72) + '" y="508" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="19" fill="#5d5348">' + esc(st.detail || '') + '</text></g>';
      }).join('');
      return tag(window.PAYLOAD.series) + F.open(
        field('#f4efe6', '#fbf7f0', '#ded6c6')
        + '<path d="M80 590 h1120" stroke="#2a2118" stroke-width="6" fill="none" stroke-dasharray="22 18" class="pathdraw"/>'
        + body
        + F.girl(1080, 330, 1.0, 'walk'));
    },

    endcard: function (c) {
      var s = window.PAYLOAD.series;
      return F.open(
        field('#f7f2ea', '#fbf7f1', '#e3dccd')
        + F.girl(540, 240, 1.45, 'point')
        + bucket(880, 470, 0.8)
        + '<text x="640" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#2a2118">'
        + esc(s.show) + '</text>'
        + '<text x="640" y="656" text-anchor="middle" font-family="Helvetica, sans-serif" font-size="22" letter-spacing="4" fill="#e4572e">'
        + esc(s.signoff) + '</text>');
    },

    hero: function (c) { return scenes.establish(c); }
  };

  return {
    renderShot: function (clip) {
      return (scenes[clip.scene] || scenes.object)(clip);
    }
  };
})();
</script>
<script>/*__RUNTIME__*/</script>
</body>
</html>
